# =============================================================================
# rvi.conf — RVI fan-sweep automation (24-bay JBOD storage DUT)
# Sourced by 00_preflight.sh, 10_fan_sweep.sh, 20_iometer_run.sh
# Customer spec: RVI test plan — sheet "Rotation Vibration"
# =============================================================================

# --- Fan sweep (vendor BMC) ---------------------------------------------------
PWM_LEVELS="20 40 60 64 68 72 76 80 84 88 92 96 100"
# Spec note: skip levels below the system/PSU design minimum PWM.
# Set to the minimum once confirmed with the platform vendor (default 0 = run all).
MIN_PWM_LEVEL=0
FAN_SETTLE_S=10
FAN_SET_PREFIX="ipmitool raw 0x36 0xFA 0x00"   # + FAN_BYTE_COUNT values
FAN_READ_CMD="ipmitool raw 0x36 0xFB"
# PROTOCOL (verified on DUT 2026-11-17, vendor BMC):
#   SET 0x36 0xFA 0x00 + exactly 16 PWM bytes — any other length is
#   rejected with rsp 0xC7 "Request data length invalid". Only value[0]
#   takes effect: it drives BOTH physical fans (system + PSU); values
#   1..15 are ignored (absent slots). The 14-byte form in the original
#   requirements doc does NOT work on this firmware.
#   READ 0x36 0xFB returns 34 bytes; the fan levels are at 0-based
#   indices 2 (system, exact) and 18 (PSU, tracks value[0] with +-1
#   drift observed). All other bytes are 00/FF.
FAN_BYTE_COUNT=16                              # number of PWM bytes in the SET command
FAN_PWM_IDX_1=2                                # 0-based index of fan 1 level in 0xFB response
FAN_PWM_IDX_2=18                               # 0-based index of fan 2 level in 0xFB response
FAN_VERIFY_TOLERANCE=3                         # +- allowed on the drift-prone fan 2 readback
FAN_VERIFY_RETRIES=3

# --- IOMeter 1.1.0 (batch mode) ----------------------------------------------
WINEPREFIX="/opt/iometer/prefix"
IOMETER_EXE="/opt/iometer/iometer.exe"
ICF_DIR="/root/rvi/icf"
ICF_4K="$ICF_DIR/4K_Random_Writes.icf"
ICF_SEQ="$ICF_DIR/256K_Seq_Writes.icf"
ICF_SMOKE="$ICF_DIR/smoke.icf"                 # 10s smoke test (1 disk)
ICF_SMOKE24="$ICF_DIR/smoke24.icf"             # 60s, 10s ramp, ALL 24 disks (preflight)
DYNAMO_BIN="/opt/iometer/dynamo"
MANAGER_NAME="rvi-dut"                         # dynamo -n + ICF manager name (must match)
DYNAMO_SELF_IP="127.0.0.1"                     # dynamo -i (agent host)
DYNAMO_MANAGER_IP="127.0.0.1"                  # dynamo -m (manager host)
IOMETER_LOGIN_TIMEOUT=60                       # /t : seconds waiting for worker to connect
RUN_WATCHDOG_S=420                             # hard timeout per IOMeter run (180s test + ramp + margin)
XVFB_DISPLAY=":99"

# --- Per-level run control ----------------------------------------------------
MAX_RETRY_PER_LEVEL=2

# --- Drives -------------------------------------------------------------------
EXPECTED_DRIVES=24                             # 24-bay JBOD DUT: 24 JBOD data bays (verified 2026-11-17)
# The DUT also has /dev/nvme0n1 (OS boot disk) and /dev/sda (0B BMC virtual
# disk) — neither belongs to the test bays. Only these 24 are IOMeter targets.
TEST_DISKS="sdb sdc sdd sde sdf sdg sdh sdi sdj sdk sdl sdm sdn sdo sdp sdq sdr sds sdt sdu sdv sdw sdx sdy"
DISK_CACHE_EXPECTED=0                          # 0 = write-caching must be off (spec step 3)

# --- Output -------------------------------------------------------------------
BASE_DIR="/root/rvi"
RESULT_DIR="$BASE_DIR/results"                 # 26 raw CSVs — kept untouched, always
REPORT_DIR="$BASE_DIR/report"                  # 30_report.py output (separate dir)
LOG_DIR="$BASE_DIR/logs"
CSV_4K_FMT="fan_%s_pct_4K_Random_Writes.csv"
CSV_SEQ_FMT="fan_%s_pct_256K_Seq_Writes.csv"
