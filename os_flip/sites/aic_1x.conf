# Baseline profile: the aic_1x site DUT (the 192.168.1.x site), Tuca_0.09.0.
# Source: SOL highlight/description scan calibration on 2026-11-06 (15-item
# Save & Exit tab; os_flip.sh 2 = 2/2 PASS on this DUT with the calibrated
# key path). No secrets: IP/MAC are test-LAN internals. The cycle opens it
# read-only.
# item_N = the item highlighted after N-1 DOWN presses (item_1 = the first
# tab item). desc "-" = no description column (Boot Override rows).
# item_1's desc was not captured (navigation starts at DOWN 1); desc
# fragments for items 2-9 follow the verified Aptio wording (shared board
# class with the tucana baseline). A --discover on this DUT rewrites the
# runner-local profile (profiles/aic_1x.conf) with the live text.
site=aic_1x
bmc_ip=192.168.1.116
dut_mac=00:15:b2:b0:51:17
firmware=Tuca_0.09.0
discovered_at=2026-11-06
# Entry via warm_reset: the verified path (2026-11-06, 20/20 cycles).
# The cold-boot one-shot on this platform is UNRELIABLE: on 2026-11-07
# three cold-on attempts never reached setup, yet a later cold-on DID
# enter setup at t=99s (the sol_boot code changed in between). Treat the
# cold-boot latch as untrustworthy; enter with bootdev-while-running +
# WARM power reset.
power_entry=warm_reset
item_count=15
item_1=Save Changes and Exit::-
item_2=Discard Changes and Exit::without saving any changes
item_3=Save Changes and Reset::Reset the system after saving the changes
item_4=Discard Changes and Reset::Reset system setup without saving any changes
item_5=Save Changes::Save Changes done so far to any of the setup option
item_6=Discard Changes::Discard Changes done so far
item_7=Restore Defaults::Restore/Load Default values for all the setup options
item_8=Save as User Defaults::Save the changes done so far as User Defaults
item_9=Restore User Defaults::Restore the User Defaults to all the setup options
item_10=Windows Boot Manager::-
item_11=UEFI: PXE IPv4 Intel::-
item_12=UEFI: PXE IPv4 American::-
item_13=UEFI: Built-in EFI Shell::-
item_14=ubuntu (Samsung SSD::-
item_15=Launch EFI Shell from filesystem device::-
target_windows_down=9
target_linux_down=13
target_linux_name=ubuntu
